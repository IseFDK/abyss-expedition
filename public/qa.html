<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ABYSS QA viewport</title><style>body{background:#ced3d6;color:#06131d;margin:0;font:14px Arial}header{padding:12px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}label{display:flex;gap:7px;align-items:center}select{font:14px Arial;padding:8px}iframe{border:0;display:block;margin:0 auto;background:#07121b;max-width:none}small{margin-left:auto}main{overflow:auto;padding-bottom:30px}</style></head><body><header><strong>ABYSS / viewport QA</strong><label>Viewport<select id="width"><option value="320">320 × 740</option><option value="390" selected>390 × 844</option><option value="768">768 × 1024</option><option value="1440">1440 × 1000</option></select></label><label>Route<select id="route"><option value="">Home</option><option value="expedition.html">Expedition</option><option value="atlas.html">Atlas</option><option value="vehicle.html">Vehicle</option><option value="species/vampire-squid.html">Species detail</option></select></label><small>Unlisted test surface · same-origin iframe</small></header><main><iframe id="viewport" title="Site viewport" src="./" width="390" height="844"></iframe></main><script>const f=document.getElementById('viewport'),w=document.getElementById('width'),r=document.getElementById('route');const v=new URLSearchParams(location.search).get('revision');const suffix=v?'?revision='+encodeURIComponent(v):'';if(suffix)f.src='./'+r.value+suffix;w.onchange=()=>{f.width=w.value;f.height=({320:740,390:844,768:1024,1440:1000})[w.value];};r.onchange=()=>{f.src='./'+r.value+suffix;};</script></body></html>
